<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GMC / GPA Intimation Dashboard</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --teal:          #0d8080;
  --teal-mid:      #0fa8a8;
  --teal-light:    #e4f4f4;
  --teal-border:   #a8dcdc;
  --navy:          #0f2544;
  --navy-mid:      #1a3560;
  --navy-light:    #243f6e;
  --slate:         #4a5a7a;
  --muted:         #6b7a99;
  --border:        #e0e7f0;
  --bg-page:       #f0f4fa;
  --bg-card:       #ffffff;
  --shadow-xs:     0 1px 2px rgba(15,37,68,.06);
  --shadow-sm:     0 2px 8px rgba(15,37,68,.08),0 1px 2px rgba(15,37,68,.04);
  --shadow-md:     0 4px 20px rgba(15,37,68,.10),0 1px 4px rgba(15,37,68,.06);
  --radius-sm:     7px;
  --radius:        11px;
  --font-body:     'Inter', 'Segoe UI', system-ui, sans-serif;
  --font-mono:     'JetBrains Mono','Fira Mono','Consolas',monospace;
  --transition:    150ms cubic-bezier(.4,0,.2,1);
}

/* ============================================================
   RESET + BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scrollbar-gutter: stable; }
body {
  font-family: var(--font-body);
  background: var(--bg-page);
  color: var(--navy);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }
:focus-visible { outline: 2.5px solid var(--teal); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #c8d0e0; border-radius: 3px; }

/* ============================================================
   HEADER
   ============================================================ */
.site-header {
  background: linear-gradient(135deg, #0c1f3f 0%, #0f2a52 50%, #0d2847 100%);
  padding: 0 32px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 0 rgba(255,255,255,.06), 0 4px 20px rgba(0,0,0,.22);
}
.site-header::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,transparent 0%,var(--teal) 30%,var(--teal-mid) 70%,transparent 100%);
  opacity:.5;
}
.header-brand { display: flex; align-items: center; gap: 12px; }
.header-logo {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-mid) 100%);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 10px rgba(13,128,128,.45);
}
.header-logo svg { color: #fff; }
.header-title { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -.01em; line-height:1.2; }
.header-sub   { font-size: 10.5px; color: rgba(255,255,255,.45); display: block; margin-top:1px; letter-spacing:.02em; }

.header-right { display:flex; align-items:center; gap:14px; }

/* avatar circle */
.header-avatar {
  width:36px; height:36px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color:#fff; letter-spacing:.02em;
  flex-shrink:0;
  border:2px solid rgba(255,255,255,.18);
  box-shadow:0 2px 8px rgba(0,0,0,.3);
  user-select:none;
}
.header-user-info { display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
.header-user-name { font-size:13px; font-weight:600; color:rgba(255,255,255,.88); line-height:1.2; }
.header-user-role { font-size:10.5px; color:rgba(255,255,255,.4); letter-spacing:.02em; }
.header-divider   { width:1px; height:22px; background:rgba(255,255,255,.12); }

.header-count {
  background:rgba(255,255,255,.10);
  color:rgba(255,255,255,.8);
  font-size:12.5px; font-weight:600;
  padding:4px 12px; border-radius:12px;
  font-variant-numeric:tabular-nums;
}

/* ============================================================
   CONTENT WRAPPER
   ============================================================ */
.content { max-width: 1300px; margin: 0 auto; padding: 28px 28px 60px; }
.page-title-row {
  display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px;
}
.page-title-row h1 {
  font-size: 20px; font-weight: 700; letter-spacing: -.02em;
}
.record-count { font-size: 13px; color: var(--muted); }

/* ============================================================
   FILTER BAR
   ============================================================ */
.filter-bar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
  overflow: hidden;
}
.tab-strip {
  display: flex;
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tab-strip::-webkit-scrollbar { display: none; }
.tab-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 13px 14px 11px;
  font-size: 13.5px; font-weight: 500;
  color: var(--muted);
  background: none; border: none;
  border-bottom: 2.5px solid transparent;
  cursor: pointer;
  transition: color 120ms, border-color 120ms;
  margin-bottom: -1px;
  white-space: nowrap;
  text-decoration: none;
}
.tab-btn:hover { color: var(--navy); }
.tab-btn.active { color: var(--teal); border-bottom-color: var(--teal); font-weight: 600; }
.tab-count {
  font-size: 11px;
  background: var(--bg-page); color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 1px 7px;
  font-weight: 600; font-variant-numeric: tabular-nums;
  min-width: 22px; text-align: center;
}
.tab-btn.active .tab-count {
  background: var(--teal-light); color: var(--teal); border-color: var(--teal-border);
}
.filter-controls {
  display: flex; align-items: center; gap: 12px; padding: 14px 20px; flex-wrap: wrap;
}
.search-wrap { position: relative; flex: 1; min-width: 200px; }
.search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}
.search-input {
  width: 100%; height: 36px; padding: 0 12px 0 34px;
  border: 1.5px solid var(--border); border-radius: 7px;
  font-size: 13.5px; color: var(--navy); background: var(--bg-page);
  outline: none; transition: border-color 150ms, box-shadow 150ms;
}
.search-input::placeholder { color: #aab4cc; }
.search-input:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(13,122,122,.1);
  background: #fff;
}
.status-select {
  height: 36px; padding: 0 28px 0 10px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm,7px);
  font-size: 13.5px; color: var(--navy);
  background: var(--bg-page) url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236b7a99' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 10px center;
  -webkit-appearance: none; appearance: none;
  outline: none; cursor: pointer; transition: border-color 150ms;
  display:none; /* hidden — replaced by date range */
}
.filter-date-wrap {
  display:flex; align-items:center; gap:6px; flex-shrink:0; flex-wrap:wrap;
}
.filter-date-label {
  font-size:11.5px; font-weight:600; color:var(--muted);
  white-space:nowrap; letter-spacing:.02em;
}
.filter-date {
  height:36px; padding:0 10px;
  border:1.5px solid var(--border); border-radius:var(--radius-sm,7px);
  font-size:13px; color:var(--navy); background:var(--bg-page);
  outline:none; cursor:pointer; font-family:inherit;
  transition:border-color 150ms,box-shadow 150ms;
}
.filter-date:focus {
  border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(13,128,128,.10);
  background:#fff;
}
.filter-date-sep { font-size:12px; color:var(--muted); font-weight:500; }
.export-btn {
  height: 36px; padding: 0 16px;
  background: var(--navy); color: #fff;
  border: none; border-radius: 7px;
  font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
  transition: background 150ms;
}
.export-btn:hover { background: var(--navy-mid); }

/* ============================================================
   TABLE
   ============================================================ */
.table-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
table {
  width: 100%; border-collapse: collapse; font-size: 13.5px;
}
thead tr { background: #f8fafc; border-bottom: 2px solid var(--border); }
th {
  padding: 11px 14px;
  text-align: left; font-size: 11.5px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); white-space: nowrap;
}
th:last-child { width: 40px; }
tbody tr.data-row {
  border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background 100ms;
}
tbody tr.data-row:hover { background: #f8fbfb; }
tbody tr.data-row.expanded { background: #f3fafa; }
tbody tr.data-row:last-of-type { border-bottom: none; }
td { padding: 12px 14px; vertical-align: middle; }
.td-mono {
  font-family: var(--font-mono); font-size: 12.5px;
  letter-spacing: .02em; color: var(--slate); font-variant-numeric: tabular-nums;
}
.sub-date { font-weight: 500; white-space: nowrap; }
.sub-time { font-size: 11.5px; color: var(--muted); display: block; margin-top: 1px; }
.emp-name { font-weight: 500; }
.emp-code { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.pat-name { font-weight: 500; }
.pat-rel  { font-size: 11.5px; color: var(--muted); }
.td-email { font-size: 13px; color: var(--slate); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.td-empty { color: var(--muted); }

/* chevron */
.chevron-btn {
  background: none; border: none; padding: 4px; cursor: pointer;
  color: var(--muted);
  display: flex; align-items: center;
  transition: color 150ms, transform 150ms; border-radius: 4px;
}
.chevron-btn:hover { color: var(--teal); }
.chevron-btn.open  { transform: rotate(180deg); color: var(--teal); }

/* ============================================================
   BADGES
   ============================================================ */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600;
  padding: 3px 9px; border-radius: 4px; white-space: nowrap;
  letter-spacing: .01em;
}
/* Type badges */
.badge-staff   { background: #dbeafe; color: #1d4ed8; }
.badge-mktg    { background: #fef9c3; color: #854d0e; }
.badge-accdt   { background: #fce7f3; color: #9d174d; }
.badge-gmcbrl  { background: #d1fae5; color: #065f46; }
.badge-gpabrl  { background: #ede9fe; color: #5b21b6; }
/* Status */
.badge-pending  { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
.badge-review   { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
.badge-approved { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
.badge-rejected { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

/* ============================================================
   DETAIL PANEL
   ============================================================ */
tr.detail-row td {
  padding: 0 !important;
  border-bottom: 2px solid var(--teal) !important;
}
.detail-panel {
  background: #f8fbfb;
  border-top: 1px solid #c8e6e6;
  padding: 24px 28px;
  animation: slideDown 180ms ease-out;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-5px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) { .detail-panel { animation: none; } }

.detail-sections {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
  gap: 18px; margin-bottom: 20px;
}
.detail-section {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px; padding: 16px 18px;
}
.section-heading {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--teal); margin: 0 0 12px;
  padding-bottom: 8px; border-bottom: 1px solid var(--teal-light);
}
.d-field { margin-bottom: 9px; }
.d-field:last-child { margin-bottom: 0; }
.d-label {
  font-size: 10.5px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 2px;
}
.d-value { font-size: 13.5px; color: var(--navy); }
.d-value.mono {
  font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
}

/* ============================================================
   PAGINATION
   ============================================================ */
.pagination {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  background: #fff; border-radius: 0 0 var(--radius) var(--radius);
  font-size: 13px; color: var(--muted);
  flex-wrap: wrap; gap: 8px;
}
.page-controls { display: flex; gap: 4px; align-items: center; }
.page-btn {
  min-width: 32px; height: 32px; padding: 0 8px;
  border: 1.5px solid var(--border); border-radius: 6px;
  background: #fff; font-size: 13px; color: var(--navy); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background 120ms, border-color 120ms, color 120ms;
  font-variant-numeric: tabular-nums;
}
.page-btn:hover:not(:disabled):not(.active) { border-color: var(--teal); color: var(--teal); }
.page-btn.active { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 700; }
.page-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty-state { text-align: center; padding: 64px 24px; color: var(--muted); }
.empty-icon {
  width: 56px; height: 56px; background: var(--teal-light); border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px; color: var(--teal);
}
.empty-state h3 { font-size: 15px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
.empty-state p  { font-size: 13.5px; margin-bottom: 18px; }
.reset-btn {
  height: 36px; padding: 0 18px;
  background: var(--teal); color: #fff;
  border: none; border-radius: 7px; font-size: 13.5px; font-weight: 600;
  cursor: pointer; transition: opacity 150ms;
}
.reset-btn:hover { opacity: .88; }

/* ============================================================
   RESPONSIVE — stacked cards below 780 px
   ============================================================ */
@media (max-width: 780px) {
  .content { padding: 14px 10px 48px; }
  .site-header { padding: 0 16px; }

  thead { display: none; }
  table, tbody, tr.data-row, td { display: block; width: 100%; }

  tr.data-row {
    border: 1px solid var(--border); border-radius: 9px;
    margin-bottom: 10px; padding: 14px 16px; background: #fff;
  }
  tr.data-row.expanded { border-color: var(--teal); }

  td {
    padding: 4px 0; border: none;
    display: flex; gap: 8px; align-items: baseline;
  }
  td::before {
    content: attr(data-label);
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); min-width: 90px; flex-shrink: 0;
  }
  td.td-chevron { justify-content: flex-end; padding-top: 8px; }
  td.td-chevron::before { display: none; }

  .table-wrap { border-radius: var(--radius); overflow: visible; background: none; border: none; box-shadow: none; }

  .detail-panel { padding: 14px; border-radius: 0 0 9px 9px; }
  .detail-sections { grid-template-columns: 1fr; }
  tr.detail-row td { display: table-cell; }

  .filter-controls { flex-direction: column; align-items: stretch; padding: 12px; }
  .search-wrap { min-width: unset; }
  .pagination { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<!-- ============================================================
     HEADER
     ============================================================ -->
<header class="site-header">
  <div class="header-brand">
    <div class="header-logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 22 22" fill="none">
        <path d="M11 2.5L4 5.5v5.5c0 4 3.1 7.6 7 8.7 3.9-1.1 7-4.7 7-8.7V5.5L11 2.5z"
              stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M8 11h6M11 8v6" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <span class="header-title">GMC / GPA Portal</span>
      <span class="header-sub">Intimation Dashboard — Admin</span>
    </div>
  </div>
  <div class="header-right">
    <div class="header-user-info">
      <span class="header-user-name" id="header-user-name">Admin</span>
      <span class="header-user-role">Administrator</span>
    </div>
    <div class="header-avatar" id="header-avatar" title="Admin">HM</div>
    <div class="header-divider" aria-hidden="true"></div>
    <span class="header-count" id="header-count">14 records</span>
  </div>
</header>

<!-- ============================================================
     CONTENT
     ============================================================ -->
<main class="content">
  <div class="page-title-row">
    <h1>Intimation Submissions</h1>
    <span class="record-count" id="visible-count"></span>
  </div>

  <!-- ── Filter Bar ── -->
  <div class="filter-bar">
    <div class="tab-strip" role="tablist" aria-label="Form type filter">
      <button class="tab-btn active" data-type="" role="tab" aria-selected="true">
        All Types <span class="tab-count" id="count-all">14</span>
      </button>
      <button class="tab-btn" data-type="Staff Mediclaim" role="tab" aria-selected="false">
        Staff Mediclaim <span class="tab-count" id="count-staff">0</span>
      </button>
      <button class="tab-btn" data-type="Marketing Mediclaim" role="tab" aria-selected="false">
        Marketing Mediclaim <span class="tab-count" id="count-mktg">0</span>
      </button>
      <button class="tab-btn" data-type="GMC Brillex Staff" role="tab" aria-selected="false">
        GMC Brillex Staff <span class="tab-count" id="count-gmcbrl">0</span>
      </button>
      <button class="tab-btn" data-type="Personal Accident" role="tab" aria-selected="false">
        Personal Accident <span class="tab-count" id="count-accdt">0</span>
      </button>
      <button class="tab-btn" data-type="GPA Brillex Staff" role="tab" aria-selected="false">
        GPA Brillex Staff <span class="tab-count" id="count-gpabrl">0</span>
      </button>
    </div>

    <div class="filter-controls">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="6" cy="6" r="4.5" stroke="#6b7a99" stroke-width="1.5"/>
            <path d="M9.5 9.5l2.5 2.5" stroke="#6b7a99" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <input type="search" id="search-input" class="search-input"
               placeholder="Search employee, policy no., patient…"
               aria-label="Search submissions"/>
      </div>

      <div class="filter-date-wrap" role="group" aria-label="Date range filter">
        <span class="filter-date-label">From</span>
        <input type="date" id="date-from" class="filter-date" aria-label="From date"/>
        <span class="filter-date-sep">—</span>
        <span class="filter-date-label">To</span>
        <input type="date" id="date-to" class="filter-date" aria-label="To date"/>
      </div>

      <button class="export-btn" id="export-btn" aria-label="Export as CSV">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M7 1v8M4 6l3 3 3-3" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 11h10" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Export
      </button>
    </div>
  </div>

  <!-- ── Table ── -->
  <div class="table-wrap" id="table-wrap">
    <table id="submissions-table" aria-label="Submission records">
      <thead>
        <tr>
          <th>Submitted</th>
          <th>Type</th>
          <th>Employee</th>
          <th>Policy No.</th>
          <th>Patient</th>
          <th>Email</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div id="empty-state" class="empty-state" style="display:none">
      <div class="empty-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <rect x="3" y="5" width="20" height="17" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M3 10h20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M8 15h10M8 18.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>
        </svg>
      </div>
      <h3>No records found</h3>
      <p>No submissions match the current filters.<br>Try adjusting your search or filter criteria.</p>
      <button class="reset-btn" id="reset-btn">Clear all filters</button>
    </div>
    <nav class="pagination" id="pagination" aria-label="Pagination">
      <span id="pagination-info"></span>
      <div class="page-controls" id="page-controls"></div>
    </nav>
  </div>
</main>

<script>
/* ============================================================
   MOCK DATA — 14 records, flat schema matching the Intimation Form
   project's MongoDB collection (intimation-form / submissions).

let state = {
  records:    MOCK.slice(),
  activeType: '',
  dateFrom:   '',
  dateTo:     '',
  search:     '',
  page:       1,
  pageSize:   6,
  expandedId: null,
};

/* ============================================================
   HELPERS
   ============================================================ */
function fmtDate(iso) {
  const d = new Date(iso);
  return {
    date: d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }),
    time: d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:true }),
  };
}
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/** Derive dashboard display label from flat formType + intimationFor */
function displayType(r) {
  if (r.formType === 'GPA') {
    return r.intimationFor === 'GPABrillexStaff' ? 'GPA Brillex Staff' : 'Personal Accident';
  }
  if (r.intimationFor === 'Marketing')    return 'Marketing Mediclaim';
  if (r.intimationFor === 'BrillexStaff') return 'GMC Brillex Staff';
  return 'Staff Mediclaim';
}

/** Full employee name from flat fields */
function empName(r) {
  return [r.firstName, r.middleName, r.surname].filter(Boolean).join(' ');
}

function typeBadge(r) {
  const type = displayType(r);
  const map = {
    'Staff Mediclaim':     'badge-staff',
    'Marketing Mediclaim': 'badge-mktg',
    'Personal Accident':   'badge-accdt',
    'GMC Brillex Staff':   'badge-gmcbrl',
    'GPA Brillex Staff':   'badge-gpabrl',
  };
  return `<span class="badge ${map[type]||''}">${esc(type)}</span>`;
}

/* avatar helpers */
const AVATAR_COLORS=['#1a56db','#0d7a7a','#7c3aed','#b45309','#0f766e','#be185d','#1d4ed8','#047857','#9333ea','#c2410c'];
function getInitials(n=''){return n.trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');}
function avatarColor(i){let h=0;for(let c of i)h=c.charCodeAt(0)+((h<<5)-h);return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length];}
const DEMO_NAME = 'Admin User';
(function initAvatar(){
  const ini=getInitials(DEMO_NAME);
  const el=document.getElementById('header-avatar');
  if(el){el.textContent=ini;el.style.background=avatarColor(ini);}
  const nm=document.getElementById('header-user-name');
  if(nm) nm.textContent=DEMO_NAME;
})();
function statusBadge(status) {
  const map = {
    'Pending':      'badge-pending',
    'Under review': 'badge-review',
    'Approved':     'badge-approved',
    'Rejected':     'badge-rejected',
  };
  const dot = { 'Pending':'●','Under review':'●','Approved':'✓','Rejected':'✕' }[status]||'●';
  return `<span class="badge ${map[status]||''}"><span style="font-size:8px;vertical-align:middle">${dot}</span> ${esc(status)}</span>`;
}

/* ============================================================
   FILTERING
   ============================================================ */
function applyFilters() {
  return state.records.filter(r => {
    if (state.activeType) {
      if (displayType(r) !== state.activeType) return false;
    }
    // date range — compare against submittedAt
    if (state.dateFrom) {
      const from = new Date(state.dateFrom + 'T00:00:00');
      if (new Date(r.submittedAt || r.createdAt) < from) return false;
    }
    if (state.dateTo) {
      const to = new Date(state.dateTo + 'T23:59:59');
      if (new Date(r.submittedAt || r.createdAt) > to) return false;
    }
    // search — no trim so spaces work mid-typing
    if (state.search) {
      const q = state.search.toLowerCase();
      const hay = [r.firstName,r.middleName,r.surname,r.employeeCode,r.policyNumber,r.patientName].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  const filtered = applyFilters();
  const total    = filtered.length;
  const { page, pageSize } = state;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const safePage   = Math.min(page, totalPages);
  if (safePage !== state.page) state.page = safePage;

  const pageRecords = filtered.slice((safePage - 1) * pageSize, safePage * pageSize);

  // ── Tab counts — count by display label ──
  const countAll    = state.records.length;
  const countStaff  = state.records.filter(r => displayType(r) === 'Staff Mediclaim').length;
  const countMktg   = state.records.filter(r => displayType(r) === 'Marketing Mediclaim').length;
  const countGmcBrl = state.records.filter(r => displayType(r) === 'GMC Brillex Staff').length;
  const countAccdt  = state.records.filter(r => displayType(r) === 'Personal Accident').length;
  const countGpaBrl = state.records.filter(r => displayType(r) === 'GPA Brillex Staff').length;
  document.getElementById('count-all').textContent    = countAll;
  document.getElementById('count-staff').textContent  = countStaff;
  document.getElementById('count-mktg').textContent   = countMktg;
  document.getElementById('count-gmcbrl').textContent = countGmcBrl;

    tbody.innerHTML = '';

        <div class="detail-section">
          <div class="section-heading">Hospital Details</div>
          <div class="d-field"><span class="d-label">Doctor</span><span class="d-value">${esc(r.doctorName)}</span></div>
          <div class="d-field"><span class="d-label">Hospital</span><span class="d-value">${esc(r.hospitalName)}</span></div>
          <div class="d-field"><span class="d-label">Address</span><span class="d-value">${esc(r.hospitalAddress)}</span></div>
          <div class="d-field"><span class="d-label">Pincode</span><span class="d-value mono">${esc(r.pincode)}</span></div>
        </div>
      </div>
    </div>
  </td>
</tr>`;

    return dataRow + detailRow;
  }).join('');

  // ── Pagination ──
  document.getElementById('pagination-info').textContent = `Showing ${from}–${to} of ${total} records`;
  renderPagination(safePage, totalPages);
}

function renderPagination(current, total) {
  const ctrl = document.getElementById('page-controls');
  if (total <= 1) { ctrl.innerHTML = ''; return; }

  const pages = buildPages(current, total);
  let html = `
    <button class="page-btn" data-page="${current-1}" ${current===1?'disabled':''} aria-label="Previous page">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <path d="M7.5 2.5L4 6l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>`;
  pages.forEach((p,i) => {
    if (p === '…') {
      html += `<span style="padding:0 4px;color:var(--muted);font-size:13px">…</span>`;
    } else {
      html += `<button class="page-btn${p===current?' active':''}" data-page="${p}" aria-label="Page ${p}" ${p===current?'aria-current="page"':''}>${p}</button>`;
    }
  });
  html += `
    <button class="page-btn" data-page="${current+1}" ${current===total?'disabled':''} aria-label="Next page">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <path d="M4.5 2.5L8 6l-3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>`;
  ctrl.innerHTML = html;
}

function buildPages(current, total) {
  if (total <= 7) return Array.from({length:total},(_,i)=>i+1);
  const pages = [];
  const add = n => pages.push(n);
  const dots = () => { if (pages[pages.length-1] !== '…') pages.push('…'); };
  add(1);
  if (current > 3) dots();
  for (let p = Math.max(2, current-1); p <= Math.min(total-1, current+1); p++) add(p);
  if (current < total-2) dots();
  add(total);
  return pages;
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.getElementById('table-body').addEventListener('click', e => {
  // Row click → expand/collapse
  const row = e.target.closest('tr.data-row');
  if (row) {
    const id = row.dataset.id;
    state.expandedId = state.expandedId === id ? null : id;
    render();
  }
});

// Keyboard nav on rows
document.getElementById('table-body').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    const row = e.target.closest('tr.data-row');
    if (row) { e.preventDefault(); const id = row.dataset.id; state.expandedId = state.expandedId===id?null:id; render(); }
  }
});

// Pagination clicks
document.getElementById('page-controls').addEventListener('click', e => {
  const btn = e.target.closest('[data-page]');
  if (btn && !btn.disabled) { state.page = parseInt(btn.dataset.page); render(); }
});

// Tab buttons
document.querySelector('.tab-strip').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
  btn.classList.add('active');
  btn.setAttribute('aria-selected','true');
  state.activeType = btn.dataset.type;
  state.page = 1;
  state.expandedId = null;
  render();
});

// Date range filters
document.getElementById('date-from').addEventListener('change', e => {
  state.dateFrom = e.target.value;
  state.page = 1; state.expandedId = null; render();
});
document.getElementById('date-to').addEventListener('change', e => {
  state.dateTo = e.target.value;
  state.page = 1; state.expandedId = null; render();
});

// Search (debounced)
let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = e.target.value.trim();
    state.page = 1;
    state.expandedId = null;
    render();
  }, 280);
});

// Clear filters
document.getElementById('reset-btn').addEventListener('click', () => {
  state.activeType = '';
  state.dateFrom   = '';
  state.dateTo     = '';
  state.search     = '';
  state.page       = 1;
  state.expandedId = null;
  document.getElementById('search-input').value = '';
  document.getElementById('date-from').value    = '';
  document.getElementById('date-to').value      = '';
  document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
  document.querySelector('.tab-btn[data-type=""]').classList.add('active');
  document.querySelector('.tab-btn[data-type=""]').setAttribute('aria-selected','true');
  render();
});

// Export CSV
document.getElementById('export-btn').addEventListener('click', () => {
  const filtered = applyFilters();
  const headers = ['Ref No.','Submitted','Form Type','Intimation For','Status',
                   'Emp Code','Emp Name','Mobile','Email',
                   'Policy No.','Patient','Relationship',
                   'Diagnosis','Treatment','Admission',
                   'Accident Location','Description','Injury','Accident Date/Time','FIR',
                   'Doctor','Hospital','Hospital Address','Pincode'];
  const rows = filtered.map(r => {
    const isAcc = r.formType === 'GPA';
    return [
      r.referenceNo, new Date(r.submittedAt||r.createdAt).toLocaleString('en-IN'),
      r.formType, r.intimationFor, r.status,
      r.employeeCode, empName(r), r.mobile, r.email,
      r.policyNumber, r.patientName, r.relationship,
      !isAcc?r.diagnosis:'', !isAcc?r.treatmentNature:'', !isAcc?r.admissionDateTime:'',
      isAcc?r.accidentLocation:'', isAcc?r.accidentDescription:'',
      isAcc?r.injuryDescription:'', isAcc?r.accidentDateTime:'', isAcc?r.firDetails:'',
      r.doctorName, r.hospitalName, r.hospitalAddress, r.pincode,
    ];
  });
  const csv = [headers,...rows].map(row => row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download = `submissions-${Date.now()}.csv`;
  a.click();
});

/* ============================================================
   BOOT
   ============================================================ */
render();
</script>
